<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A beautifully designed Tic-Tac-Toe game with stunning visuals and smooth animations.">
    <title>Tic-Tac-Toe | Premium Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container">
        <header>
            <h1 id="game-title">Tic-Tac-Toe</h1>
            <p class="subtitle">Premium Edition</p>
        </header>

        <div id="status-bar" class="status-bar">
            <div id="player-x-indicator" class="player-indicator active">
                <span class="player-symbol x-symbol">X</span>
                <span class="player-label">Player X</span>
            </div>
            <div class="vs-divider">VS</div>
            <div id="player-o-indicator" class="player-indicator">
                <span class="player-symbol o-symbol">O</span>
                <span class="player-label">Player O</span>
            </div>
        </div>

        <div id="scoreboard" class="scoreboard">
            <div class="score-card x-score">
                <span class="score-label">X Wins</span>
                <span id="x-score" class="score-value">0</span>
            </div>
            <div class="score-card draw-score">
                <span class="score-label">Draws</span>
                <span id="draw-score" class="score-value">0</span>
            </div>
            <div class="score-card o-score">
                <span class="score-label">O Wins</span>
                <span id="o-score" class="score-value">0</span>
            </div>
        </div>

        <div id="game-board" class="game-board">
            <div class="cell" data-index="0" id="cell-0"></div>
            <div class="cell" data-index="1" id="cell-1"></div>
            <div class="cell" data-index="2" id="cell-2"></div>
            <div class="cell" data-index="3" id="cell-3"></div>
            <div class="cell" data-index="4" id="cell-4"></div>
            <div class="cell" data-index="5" id="cell-5"></div>
            <div class="cell" data-index="6" id="cell-6"></div>
            <div class="cell" data-index="7" id="cell-7"></div>
            <div class="cell" data-index="8" id="cell-8"></div>
        </div>

        <div id="game-message" class="game-message hidden">
            <div class="message-content">
                <span id="message-text" class="message-text"></span>
                <div class="confetti-container" id="confetti-container"></div>
            </div>
        </div>

        <div class="controls">
            <button id="restart-btn" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
                New Game
            </button>
            <button id="reset-scores-btn" class="btn btn-secondary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                Reset Scores
            </button>
        </div>

        <div class="mode-toggle">
            <button id="mode-pvp" class="mode-btn active" data-mode="pvp">👥 PvP</button>
            <button id="mode-ai" class="mode-btn" data-mode="ai">🤖 vs AI</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
